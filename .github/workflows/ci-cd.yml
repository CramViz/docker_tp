name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}

jobs:
  # Job 1: Build et tests
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd docker-backend-api
          mvn clean package -DskipTests

      - name: Run tests
        run: |
          cd docker-backend-api
          mvn test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: docker-backend-api/target/*.jar
          retention-days: 1

  # Job 2: Build et push Docker image
  build-and-push-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./docker-backend-api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_REPO }}:latest
            ${{ secrets.DOCKERHUB_REPO }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_REPO }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_REPO }}:buildcache,mode=max

  # Job 3: Deploy vers production (manuel approval pour main, auto pour develop)
  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Create Ansible vault password file
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass.txt
          chmod 600 /tmp/vault_pass.txt

      - name: Deploy with Ansible
        run: |
          cd ansible
          ansible-playbook -i inventories/setup.yml deploy.yml \
            --vault-password-file /tmp/vault_pass.txt \
            -e "backend_image=${{ secrets.DOCKERHUB_REPO }}:${{ github.sha }}" \
            -e "deploy_env=${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}"

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa /tmp/vault_pass.txt

      - name: Health check
        run: |
          sleep 10
          curl -f http://${{ secrets.DEPLOY_HOST }}/api/ || exit 1
          curl -f http://${{ secrets.DEPLOY_HOST }}/api/students || exit 1
          echo "✅ Deployment successful and healthy!"
