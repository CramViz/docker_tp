name: CI devops 2025

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build, test & SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp clean verify sonar:sonar \
            -Dsonar.projectKey=CramViz_docker_tp \
            -Dsonar.organization=cramviz \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${SONAR_TOKEN} \
            --file ./docker-backend-api/pom.xml

  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # Backend
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./docker-backend-api
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-backend:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # Database
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./docker-db
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-postgres:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # HTTPD
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./docker-httpd
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}
