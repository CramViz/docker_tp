name: CI devops 2025

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build, test & SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp clean verify sonar:sonar \
            -Dsonar.projectKey=CramViz_docker_tp \
            -Dsonar.organization=cramviz \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${SONAR_TOKEN} \
            --file ./docker-backend-api/pom.xml

  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # Backend
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./docker-backend-api
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-backend:latest
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      # Database
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./docker-db
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-postgres:latest
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      # HTTPD
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./docker-httpd
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      # Frontend
      - name: Build image and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./docker-frontend
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-frontend:latest
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

  # Job 3: Deploy
  deploy:
    needs: build-and-push-docker-image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Create Ansible vault password file
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > vault_pass.txt
          chmod 600 vault_pass.txt

      - name: Deploy with Ansible via Docker
        run: |
          docker run --rm \
            -v $(pwd)/ansible:/ansible \
            -v ~/.ssh:/root/.ssh:ro \
            -v $(pwd)/vault_pass.txt:/vault_pass.txt:ro \
            cytopia/ansible:latest-tools \
            ansible-playbook -i /ansible/inventories/setup.yml /ansible/deploy.yml \
              --vault-password-file /vault_pass.txt

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa vault_pass.txt

      - name: Health check
        run: |
          sleep 10
          curl -f http://${{ secrets.DEPLOY_HOST }}/api/ || exit 1
          curl -f http://${{ secrets.DEPLOY_HOST }}/api/students || exit 1
          echo "✅ Deployment successful and healthy!"

