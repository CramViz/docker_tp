---
- name: Deploy 3-tier application
  hosts: prod
  become: yes
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    backend_image: "cramviz/my-backend:latest"
    httpd_image: "cramviz/my-httpd:latest"
    network_name: app-network
    app_env:
      DB_HOST: db
      DB_NAME: db
      DB_USER: usr
      DB_PASSWORD: pwd

  tasks:
    - name: Install required packages
      apt:
        name:
          - docker.io
          - python3-docker
        state: present
        update_cache: yes

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create Docker network
      community.docker.docker_network:
        name: "{{ network_name }}"
        state: present

    - name: Pull backend image
      community.docker.docker_image:
        name: "{{ backend_image }}"
        source: pull
        state: present
        force_source: yes

    - name: Pull httpd image
      community.docker.docker_image:
        name: "{{ httpd_image }}"
        source: pull
        state: present
        force_source: yes

    - name: Stop old backend container
      community.docker.docker_container:
        name: backend
        state: absent
      ignore_errors: yes

    - name: Run backend container
      community.docker.docker_container:
        name: backend
        image: "{{ backend_image }}"
        state: started
        restart_policy: always
        networks:
          - name: "{{ network_name }}"
        env: "{{ app_env }}"
        ports:
          - "8080:8080"

    - name: Stop old httpd container
      community.docker.docker_container:
        name: httpd
        state: absent
      ignore_errors: yes

    - name: Run httpd container
      community.docker.docker_container:
        name: httpd
        image: "{{ httpd_image }}"
        state: started
        restart_policy: always
        networks:
          - name: "{{ network_name }}"
        ports:
          - "80:80"

    - name: Wait for backend to be healthy
      uri:
        url: "http://localhost:8080/api/"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 2
      ignore_errors: yes
